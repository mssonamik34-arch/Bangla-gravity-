name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          GODOT_VERSION="4.3"
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip -d godot-bin
          sudo install -m 0755 godot-bin/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o templates.tpz
          mkdir templates-unpacked
          unzip -q templates.tpz -d templates-unpacked
          cp -a templates-unpacked/templates/. "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/"
          printf "%s" "$GODOT_VERSION.stable" > "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/version.txt"

      - name: Configure Android debug signing
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate project import
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/BanglaGravity-debug.apk
          test -s build/BanglaGravity-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bangla-Gravity-Android-APK
          path: build/BanglaGravity-debug.apk
          if-no-files-found: error
          retention-days: 14
